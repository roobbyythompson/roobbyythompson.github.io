<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080910">
  <title>EVE profile</title>

  <!--
    Link preview card.

    Social scrapers (iMessage, Instagram, X, Discord, WhatsApp, Slack) fetch
    this page and read these tags. Without them a shared profile link renders
    as a bare grey URL, which is what it did before.

    These are deliberately generic rather than per-handle: GitHub Pages is
    static, scrapers do not run JavaScript, and there is no server to render
    "@robby on EVE" into the tags per URL. So the card is branded and correct
    for every profile rather than personalised and wrong for all of them.

    og:image must be an absolute URL — relative paths are silently ignored by
    every major scraper.
  -->
  <meta property="og:site_name" content="EVE">
  <meta property="og:type" content="website">
  <meta property="og:title" content="EVE — your private AI companion">
  <meta property="og:description" content="An AI companion that lives on your iPhone, and the people you choose to share it with. Free on the App Store.">
  <meta property="og:url" content="https://roobbyythompson.github.io/eve/profile/">
  <meta property="og:image" content="https://roobbyythompson.github.io/eve/share-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="EVE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EVE — your private AI companion">
  <meta name="twitter:description" content="An AI companion that lives on your iPhone. Free on the App Store.">
  <meta name="twitter:image" content="https://roobbyythompson.github.io/eve/share-card.png">
  <meta name="description" content="An AI companion that lives on your iPhone, and the people you choose to share it with. Free on the App Store.">

  <!-- Apple's own banner, for anyone opening this in Safari on an iPhone. -->
  <meta name="apple-itunes-app" content="app-id=APP_STORE_ID_PENDING">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../eve-logo.png">

  <script>
    // Every path out of this page ends at the App Store. Someone shared a
    // profile to bring a person in; sending them to a site root instead was a
    // dead end, which is what this used to do.
    //
    // SET AT SUBMISSION: replace with the real numeric id from App Store
    // Connect. This is the only place it appears on this page.
    // PRE-LAUNCH: null until EVE is live, so nothing points at a 404 store page.
    // At submission set this to "https://apps.apple.com/app/id1234567890".
    window.EVE_APP_STORE_URL = null;
  </script>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 15% 5%, #34206d 0, transparent 38%), radial-gradient(circle at 90% 90%, #123d57 0, transparent 42%), #080910; color: #f7f7fb; }
    main { width: min(100%, 560px); padding: 36px; border: 1px solid rgba(255,255,255,.13); border-radius: 28px; background: rgba(18,19,29,.84); box-shadow: 0 24px 80px rgba(0,0,0,.38); text-align: center; }
    .avatar { width: 82px; height: 82px; margin: 0 auto; display: block; border-radius: 22px; }
    h1 { margin: 20px 0 6px; font-size: clamp(30px, 8vw, 48px); letter-spacing: -.04em; }
    p { color: #b9bbca; font-size: 17px; line-height: 1.5; }
    .button { display: block; margin-top: 24px; padding: 15px 20px; border-radius: 999px; color: white; text-decoration: none; font-weight: 700; background: linear-gradient(90deg, #a74cff, #35bff2); }
    .store { display: inline-block; margin-top: 16px; color: #f7f7fb; font-size: 15px; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.28); padding-bottom: 2px; }
    .legal { display: inline-block; margin-top: 22px; color: #8edcff; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="../eve-logo.png" width="82" height="82" alt="EVE">
    <h1 id="handle">EVE profile</h1>
    <p>Open this profile in EVE to follow, Tap In, view their public feed, or start a protected chat.</p>
    <a class="button" id="open" href="#">Open in EVE</a>
    <a class="store" id="store" href="#">Coming to the App Store</a>
    <a class="legal" href="https://roobbyythompson.github.io/eve-legal/">Privacy &amp; legal</a>
  </main>
  <script>
    const store = window.EVE_APP_STORE_URL;
    const raw = new URLSearchParams(location.search).get("handle") || "";
    const handle = raw.replace(/^@/, "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 24);

    const open = document.getElementById("open");
    const storeLink = document.getElementById("store");
    if (store) {
      storeLink.href = store;
      storeLink.textContent = "Don't have EVE? Get it free";
    } else {
      // No store page yet — leave it as plain text rather than a dead link.
      storeLink.removeAttribute("href");
    }

    if (handle) {
      document.title = `@${handle} on EVE`;
      document.getElementById("handle").textContent = `@${handle}`;
      open.href = `eve://profile/${encodeURIComponent(handle)}`;
    } else if (store) {
      // No handle means this is not really a profile link — send them to the
      // App Store rather than to a custom scheme that will do nothing.
      open.href = store;
    } else {
      open.textContent = "Coming to the App Store";
      open.removeAttribute("href");
    }

    // If EVE is installed, iOS opens it through the Associated Domains
    // entitlement before this page is ever drawn. Reaching this line usually
    // means it is not installed — but a custom scheme that goes nowhere fails
    // silently, so fall through to the store if nothing happened.
    open.addEventListener("click", function () {
      if (!handle || !store) return;
      const left = Date.now();
      setTimeout(function () {
        // Backgrounding to the app stops timers, so a long gap means it opened.
        if (document.hidden || Date.now() - left > 1600) return;
        window.location.href = store;
      }, 1200);
    });
  </script>
</body>
</html>
