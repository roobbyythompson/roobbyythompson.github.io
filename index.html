<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080910">
  <title>EVE · Social Intelligence</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 0%, #34206d 0, transparent 38%), radial-gradient(circle at 90% 90%, #123d57 0, transparent 42%), #080910; color: #f7f7fb; }
    main { width: min(100%, 560px); padding: 36px; border: 1px solid rgba(255,255,255,.13); border-radius: 28px; background: rgba(18,19,29,.82); box-shadow: 0 24px 80px rgba(0,0,0,.38); backdrop-filter: blur(22px); }
    .mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; font-size: 30px; background: linear-gradient(135deg, #b55cff, #4bc9ff); }
    h1 { margin: 22px 0 8px; font-size: clamp(32px, 8vw, 52px); letter-spacing: -.04em; }
    p { color: #b9bbca; font-size: 17px; line-height: 1.55; }
    a { color: #8edcff; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>EVE</h1>
    <p>Private AI, real friends, and a social feed built around the people you choose.</p>
    <p>Profile links open directly in EVE on iPhone when the app is installed.</p>
    <p><a href="https://roobbyythompson.github.io/eve-legal/">Privacy &amp; legal</a></p>
  </main>
</body>
</html>
